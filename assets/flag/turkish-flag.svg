<?xml version="1.0" encoding="UTF-8"?>
<!--
  turkish-flag.svg - Flag of Turkey (Turk bayragi), strict geometry
  Law: Turk Bayragi Kanunu No. 2893; G = flag width (=hoist side) = 800 px here
  ratio h:w = 2:3  ->  viewBox 0 0 1200 800
  red #E30A17 (Pantone 186C), white #FFFFFF
  crescent: outer r = G/4 (200), inner r = G/5 (160), centres 0.5G / 0.5625G
  star: circumradius G/8 (100), centre at 197/240 G, one tip toward the hoist
  generated by js/flag.js -> PDT.Flag.svgString(1200,800); do not hand-edit
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Flag of Turkey">
<title>Turkiye bayragi / Flag of Turkey (2:3, G=1)</title>
