name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable / configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site
        run: |
          mkdir -p _site/docs
          cp -a index.html .nojekyll css js assets _site/
          cp -a docs/*.md _site/docs/ 2>/dev/null || true
          cp -a docs/preview _site/docs/ 2>/dev/null || true
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
